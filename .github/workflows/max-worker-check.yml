name: MAX Worker check

on:
  push:
    paths:
      - 'max-worker/**'
      - 'tests/max-bot.mjs'
      - '.github/workflows/max-worker-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check max-worker/src/index.js
      - name: Subscriptions, notices and schema migration (SQLite in place of D1)
        run: node tests/max-bot.mjs
