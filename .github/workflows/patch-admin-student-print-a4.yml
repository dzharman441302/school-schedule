name: Patch admin student print A4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-student-print-a4.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Admin.html
        run: python tools/patch_admin_student_print_a4.py
      - name: Commit patched Admin.html
        run: |
          if git diff --quiet -- apps-script/Admin.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Admin.html
          git commit -m "Redesign student print for one portrait A4 sheet"
          git push
