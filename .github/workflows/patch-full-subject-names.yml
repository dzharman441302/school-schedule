name: Patch full subject names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-full-subject-names.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply subject name patch
        run: python tools/patch_full_subject_names.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html staff.html tv.html tv-students.html schedule.js staff.js tv.js tv-students.js
          git commit -m "Show full subject names on public schedules"
          git push
