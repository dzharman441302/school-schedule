name: Patch information and announcements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-info-announcements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch public UI and Admin
        run: python tools/patch_info_announcements.py
      - name: Commit changes
        run: |
          if git diff --quiet -- site-enhancements.js tv-students.html apps-script/Admin.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-enhancements.js tv-students.html apps-script/Admin.html
          git commit -m "Add school information panel and announcements editor"
          git push
