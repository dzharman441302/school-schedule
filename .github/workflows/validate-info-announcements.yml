name: Validate information and announcements UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-info-announcements.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax and required UI markers
        run: |
          node --check site-enhancements.js
          node --check tv-students.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('apps-script/Admin.html').read_text(encoding='utf-8')
          required=['data-tab="notices"','id="notices-view"','id="notice-save"','listNoticesAdmin','saveNotice','deleteNotice','uploadNoticeFile']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing Admin markers: '+', '.join(missing))
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,flags=re.S|re.I)
          code='\n'.join(scripts)
          Path('/tmp/admin-inline.js').write_text(code,encoding='utf-8')
          print('Admin markers OK; inline JS bytes:',len(code.encode()))
          PY
          node --check /tmp/admin-inline.js
          grep -q 'home-info-panel' site-enhancements.js
          grep -q 'currentLessonGlow' tv-students.html
