name: Validate TV screens

on:
  push:
    branches: [main]
    paths:
      - 'tv.js'
      - 'tv-students.js'
      - 'tv-core.js'
      - 'schedule-core.js'
      - 'subject-names.js'
      - 'app.js'
      - 'tv.html'
      - 'tv-students.html'
      - 'tv.css'
      - 'tests/tv-*.js'
      - '.github/workflows/validate-tv-js.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check tv-core.js
          node --check tv.js
          node --check tv-students.js
          node --check subject-names.js
      - name: Staff room grid, alphabetical pages and refresh-safe rotation
        run: node tests/tv-rotation.js
      - name: Student parallel board, changes and lost connection
        run: node tests/tv-students.js
      - name: Check both screens share the stage and load scripts in order
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('subject-names.js','utf8'),context);
          const subjects=context.window.SchoolSubjects;
          for(const [short,full] of [['Вер','Вероятность и статистика'],['внеур','Внеурочная деятельность'],['Про','Программирование'],['ПРОФ','Профориентация'],['Ф-РА','Физическая культура']]){
            assert.equal(subjects.expandSubject(short),full);
          }
          const order=['config.js','app.js','subject-names.js','schedule-core.js','tv-core.js'];
          for(const [html,app] of [['tv.html','tv.js'],['tv-students.html','tv-students.js']]){
            const text=fs.readFileSync(html,'utf8');
            assert(text.includes('tv.css'),html+': tv.css');
            assert(text.includes('id="stage"'),html+': 1920×1080 stage');
            const scripts=[...text.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/g)].map(m=>m[1].split('?')[0]);
            assert.deepEqual(scripts,[...order,app],html+': script order');
          }
          console.log('Subject names, shared stage and TV script order verified');
          JS
