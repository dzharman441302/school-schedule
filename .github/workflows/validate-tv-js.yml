name: Validate TV screens

on:
  push:
    branches: [main]
    paths:
      - 'tv.js'
      - 'tv-students.js'
      - 'subject-names.js'
      - 'tv.html'
      - 'tv-students.html'
      - 'tv.css'
      - 'tests/tv-rotation.js'
      - '.github/workflows/validate-tv-js.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check tv.js
          node --check tv-students.js
          node --check subject-names.js
      - name: Check complete teacher rotation across refreshes
        run: node tests/tv-rotation.js
      - name: Check active-schedule logic
        run: |
          grep -q "visibleByTime" tv.js
          grep -q "hasRealLesson" tv.js
          grep -q "rebuildCards" tv.js
          grep -q "activeParallelSnapshots" tv-students.js
          grep -q "Перемена · далее" tv-students.js
      - name: Check TV notice is hidden and both screens share tv.css
        run: |
          grep -q "tv.css" tv.html
          grep -q "tv.css" tv-students.html
          grep -q '#notice{display:none!important}' tv.css
          grep -q 'id="segments"' tv.html
          grep -q 'id="segments"' tv-students.html
      - name: Check full subject names and script load order
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('subject-names.js','utf8'),context);
          const subjects=context.window.SchoolSubjects;
          for(const [short,full] of [['Вер','Вероятность и статистика'],['внеур','Внеурочная деятельность'],['Про','Программирование'],['ПРОФ','Профориентация'],['Ф-РА','Физическая культура']]){
            assert.equal(subjects.expandSubject(short),full);
          }
          for(const [html,app] of [['tv.html','tv.js'],['tv-students.html','tv-students.js']]){
            const text=fs.readFileSync(html,'utf8');
            const scripts=[...text.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/g)].map(m=>m[1].split('?')[0]);
            const dictionary=scripts.indexOf('subject-names.js');
            assert(dictionary>=0 && dictionary<scripts.indexOf(app),html+': dictionary must load before renderer');
          }
          console.log('Full subject-name expansion and TV script order verified');
          JS
