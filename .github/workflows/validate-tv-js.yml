name: Validate TV screen JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'tv.js'
      - 'tv-students.js'
      - '.github/workflows/validate-tv-js.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check tv.js
          node --check tv-students.js
      - name: Check active-schedule logic is present
        run: |
          grep -q "visibleByTime" tv.js
          grep -q "hasRealLesson" tv.js
          grep -q "activeParallelSnapshots" tv-students.js
          grep -q "ПЕРЕМЕНА · далее" tv-students.js
