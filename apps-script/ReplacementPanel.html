<style>
.repl-dialog[hidden],.repl-view[hidden],.repl-manual[hidden]{display:none!important}
.repl-dialog{position:fixed;inset:0 auto auto 0;width:100vw;height:100dvh;z-index:100;background:rgba(14,30,58,.45);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center}
.repl-window{min-width:0;max-width:100%;width:min(1240px,100%);height:min(92vh,1000px);background:#f5f7fb;border:1px solid #d2dced;border-radius:18px;box-shadow:0 20px 75px #112a5c40;display:flex;flex-direction:column;overflow:hidden}
.repl-head,.repl-tools,.repl-tabs,.repl-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 18px;background:white;border-bottom:1px solid #dce3ef}
.repl-head{justify-content:space-between}.repl-head>div{min-width:0;flex:1 1 240px}.repl-head h2{margin:0;font-size:23px;color:#18345f}.repl-head p{margin:4px 0 0;font-size:12px;color:#526783;max-width:890px}
.repl-tools label{display:grid;gap:3px;font-size:11px;color:#526783}.repl-tools input,.repl-tools select{padding:7px;border:1px solid #cbd6e7;border-radius:7px;min-height:34px;font:inherit;font-size:13px}
.repl-tabs button{background:#edf2fa;color:#344e76;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:800}.repl-tabs button.active{background:#173966;color:#fff}
.repl-content{flex:1;min-height:0;overflow:auto;padding:16px 18px}.repl-notice{border:1px solid #d4e0f0;background:#edf4ff;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.45;color:#28496c}.repl-notice.error{background:#fff1f2;border-color:#e9b5b9;color:#8e2433}
.repl-entry{min-width:0;overflow-wrap:anywhere;background:#fff;border:1px solid #d6dfed;border-radius:12px;margin:10px 0;padding:12px 14px;display:grid;gap:10px;grid-template-columns:minmax(240px,1fr) minmax(440px,1.2fr)}
.repl-entry h3{margin:0 0 5px;font-size:16px;color:#18345f}.repl-entry .repl-meta{font-size:13px;line-height:1.45}.repl-entry p{font-size:12px;color:#526783;margin:5px 0;line-height:1.4}.repl-entry small{display:block;font-size:11px;color:#637796}
.repl-edit{display:grid;grid-template-columns:minmax(160px,1fr) 86px;gap:7px}.repl-edit label{display:grid;gap:3px;font-size:11px;color:#526783}.repl-edit .wide{grid-column:1/-1}.repl-edit input,.repl-edit select{width:100%;min-width:0;box-sizing:border-box;padding:8px;border:1px solid #c9d6e8;border-radius:8px;min-height:36px;background:#fff;font-size:13px}
.repl-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 14px}.repl-kpi>div{background:white;border:1px solid #d6dfed;padding:12px;border-radius:11px}.repl-kpi strong{display:block;font-size:24px;color:#193c69}.repl-kpi span{font-size:12px;color:#627592}
.repl-scroll{overflow:auto}.repl-table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}.repl-table th,.repl-table td{padding:9px;text-align:left;vertical-align:top;border:1px solid #dce3ef;line-height:1.4}.repl-table th{background:#eaf0f9;color:#244669}.repl-tag{display:inline-block;border-radius:6px;padding:3px 6px;font-size:11px;font-weight:700;background:#edf1f7;color:#526783}.repl-tag.confirm{background:#dcefe6;color:#256546}.repl-tag.pending{background:#fff0cc;color:#86610f}.repl-tag.obsolete,.repl-tag.legacy{background:#f1e4e7;color:#7f4b58}
.repl-manual{padding:12px;border:1px solid #c9d8ee;border-radius:10px;background:#edf3fb;margin-bottom:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.repl-manual label{display:grid;font-size:12px;gap:4px}.repl-manual input{min-width:0;padding:8px;border:1px solid #bfcfe6;border-radius:8px}.repl-manual .wide{grid-column:1/-1}
.repl-footer{padding:9px 18px;border-top:1px solid #dce3ef;background:#fff;font-size:11px;color:#5c718e}.repl-badge{border-radius:8px;padding:2px 5px;background:#fff0cc;color:#7e5e12;margin-left:3px}
@media(max-width:760px){.repl-dialog{padding:0}.repl-window{height:100dvh;max-height:100dvh;border-radius:0}.repl-content{padding:10px}.repl-head,.repl-tools,.repl-tabs,.repl-actions{padding:10px}.repl-entry{grid-template-columns:1fr;padding:11px}.repl-manual{grid-template-columns:1fr}.repl-kpi strong{font-size:20px}.repl-tools label{flex:1;min-width:115px}.repl-tools input,.repl-tools select{width:100%;min-width:0;max-width:100%}.repl-head>div{min-width:0;flex:1 1 240px}.repl-head h2{font-size:20px}}
@media print{.repl-dialog{display:none!important}}

.repl-week-reminder[hidden],#repl-audit-day[hidden]{display:none!important}
.repl-week-reminder{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 16px;margin:12px 0;border:1px solid #e5ca87;border-radius:12px;background:#fff7df;color:#5c430b}
.repl-week-reminder strong,.repl-week-reminder span{display:block}.repl-week-reminder span{margin-top:4px;font-size:13px}
.repl-week-reminder.error{background:#fff1f2;border-color:#e9b5b9;color:#8e2433}
.repl-day-title{font-size:15px;color:#244669;padding:10px 0 5px;margin:14px 0 0;text-transform:none;border-bottom:1px solid #d6dfed}
.repl-day-title small{font-size:12px;font-weight:400;float:right;text-transform:none}
#repl-week-label{font-size:14px;color:#244669}#repl-save-state{font-size:12px;color:#795b12}
@media(max-width:760px){.repl-week-reminder{align-items:flex-start;flex-direction:column}.repl-tools button{font-size:12px}.repl-tools strong{width:100%}.repl-kpi{grid-template-columns:1fr 1fr}.repl-kpi>div:last-child{grid-column:1/-1}}
@media print{.repl-week-reminder{display:none!important}}

/* Compact review keeps a week's decisions in view; calculations are unchanged. */
#replacement-dialog .repl-head{padding:10px 18px}#replacement-dialog .repl-head h2{font-size:21px}
#replacement-dialog .repl-tools,#replacement-dialog .repl-tabs{padding:7px 18px;gap:7px}
#replacement-dialog .repl-content{padding:10px 18px}#replacement-dialog .repl-notice{padding:7px 10px;margin-bottom:8px;font-size:12px}
#replacement-dialog .repl-actions{position:sticky;top:-10px;z-index:3;padding:8px 10px}
#replacement-dialog .repl-entry{grid-template-columns:minmax(200px,.65fr) minmax(470px,1.35fr);padding:10px 12px;border-radius:8px;margin:7px 0;gap:14px}
#replacement-dialog .repl-entry h3{font-size:14px}#replacement-dialog .repl-meta{font-size:12px}
#replacement-dialog .repl-edit{grid-template-columns:minmax(160px,1fr) 142px 70px;gap:6px}
#replacement-dialog .repl-edit>label:nth-child(1){grid-column:2;grid-row:1}
#replacement-dialog .repl-edit>label:nth-child(2){grid-column:3;grid-row:1}
#replacement-dialog .repl-edit>label:nth-child(3){grid-column:1;grid-row:1}
#replacement-dialog .repl-edit>label:nth-child(4){grid-column:1/-1;grid-row:2}
.repl-basis{margin-top:6px;color:#607793;font-size:11px}.repl-basis summary{cursor:pointer}.repl-basis p{margin:5px 0!important}
@media(max-width:760px){
 #replacement-dialog .repl-head{flex-wrap:nowrap;padding:11px}#replacement-dialog .repl-head>div{flex:1 1 0}#replacement-dialog .repl-head p{font-size:11px}#replacement-dialog .repl-head h2{font-size:18px}
 #replacement-dialog .repl-tabs{padding:7px 10px;gap:5px}#replacement-dialog .repl-tabs button{font-size:11px;min-height:36px;padding:7px 8px}
 #replacement-dialog .repl-tools{padding:8px 10px}#replacement-dialog .repl-content{padding:8px}
 #replacement-dialog .repl-entry{grid-template-columns:1fr;padding:10px;gap:10px}
 #replacement-dialog .repl-edit{grid-template-columns:minmax(0,1fr) 70px}
 #replacement-dialog .repl-edit>label:nth-child(3){grid-column:1/-1;grid-row:1}
 #replacement-dialog .repl-edit>label:nth-child(1){grid-column:1;grid-row:2}
 #replacement-dialog .repl-edit>label:nth-child(2){grid-column:2;grid-row:2}
 #replacement-dialog .repl-edit>label:nth-child(4){grid-column:1/-1;grid-row:3}
 #replacement-dialog .repl-edit input,#replacement-dialog .repl-edit select{font-size:16px;min-height:44px}
 #replacement-dialog .repl-actions{top:-8px;gap:6px}#replacement-dialog .repl-actions button{min-height:40px;font-size:11px}
}
</style>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status={pending:'Проверить',confirm:'Учесть',exclude:'Не учитывать',obsolete:'Снято новой публикацией',legacy:'Старый журнал'};
const kinds={replacement:'Замещение',combined:'Объединённые классы',ambiguous:'Подгруппы — проверить',manual:'Ручная запись','student-mismatch':'Расхождение с учениками'};
let api=null,review=null,ledger=null,tab='review',busy=false,previousFocus=null,badgeRun=0,reminderWeek=null;
const changed=new Set();
const button=document.createElement('button');button.type='button';button.className='btn quiet small';button.id='replacements-button';
button.innerHTML='Учёт замен <span class="repl-badge" id="replacement-badge">—</span>';($('#replacements-slot')||$('.top-actions')).prepend(button);
const reminder=document.createElement('aside');reminder.id='replacement-week-reminder';reminder.className='repl-week-reminder';reminder.hidden=true;reminder.setAttribute('role','status');
reminder.innerHTML='<div><strong>Проверьте замены за неделю</strong><span id="replacement-week-text"></span></div><button class="btn quiet small" type="button" id="replacement-week-open">Открыть неделю</button>';
const controls=$('#app-view .controls');if(controls)controls.after(reminder);else $('#app-view').prepend(reminder);
const dialog=document.createElement('section');dialog.className='repl-dialog';dialog.id='replacement-dialog';dialog.hidden=true;
dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','replacement-title');
dialog.innerHTML=`<div class="repl-window"><header class="repl-head"><div><h2 id="replacement-title">Замены за неделю</h2><p>Только переданные уроки. Часы учитываются после вашего подтверждения.</p></div><button class="btn quiet small" id="repl-close">Закрыть</button></header>
<div class="repl-tabs"><button data-repl-tab="review" class="active">Проверить неделю</button><button data-repl-tab="journal">Журнал</button><button data-repl-tab="summary">Сводка часов</button><button data-repl-tab="audit">История решений</button></div>
<div class="repl-tools"><button class="btn quiet small" id="repl-prev" aria-label="Предыдущая неделя">← Неделя</button><button class="btn quiet small" id="repl-current">Текущая неделя</button><button class="btn quiet small" id="repl-next" aria-label="Следующая неделя">Неделя →</button><strong id="repl-week-label"></strong></div>
<div class="repl-tools"><label>Период с<input type="date" id="repl-from"></label><label>по<input type="date" id="repl-to"></label><label id="repl-audit-day" hidden>День истории<input type="date" id="repl-date"></label><label>Учитель<select id="repl-teacher"><option value="">Все учителя</option></select></label><label>Записи<select id="repl-filter"><option value="active">Актуальные</option><option value="confirm">Учтённые</option><option value="pending">Ожидают решения</option><option value="exclude">Не учитывать</option><option value="all">Все, включая архив</option></select></label><button class="btn quiet small" id="repl-refresh">Обновить</button><button class="btn quiet small" id="repl-restore">Восстановить период</button></div>
<div class="repl-content"><div id="repl-message" class="repl-notice" role="status"></div>
<div id="repl-review" class="repl-view"><div class="repl-actions"><button class="btn quiet small" id="repl-recommend">Применить рекомендации</button><button class="btn success" id="repl-save">Сохранить решения за неделю</button><button class="btn quiet small" id="repl-manual-toggle">Добавить запись вручную</button><span id="repl-save-state"></span></div>
<form class="repl-manual" id="repl-manual" hidden><label>Дата<input name="date" type="date" required></label><label>Кто заменяет<input name="replacementTeacher" list="repl-teachers" required></label><label>Кого заменяет<input name="originalTeachers" list="repl-teachers" required></label><label>Номер урока<input name="lesson" type="number" min="1" max="12" required></label><label>Класс / два класса<input name="className" placeholder="5А + 5Б" required></label><label>Предмет<input name="subject" list="subjects-list" required></label><label>Кабинет<input name="room"></label><label>Причина ручной записи<input name="comment" required></label><div class="wide"><button class="btn" type="submit">Добавить для проверки</button></div></form><div id="repl-review-list"></div></div>
<div id="repl-journal" class="repl-view" hidden><div class="repl-actions"><button class="btn quiet small" id="repl-csv">CSV подтверждённых замен</button><button class="btn quiet small" id="repl-print-detail">Печать подтверждённых</button></div><div id="repl-journal-list"></div></div>
<div id="repl-summary" class="repl-view" hidden><div class="repl-actions"><button class="btn quiet small" id="repl-print-summary">Печать сводки</button></div><div id="repl-summary-list"></div></div><div id="repl-audit" class="repl-view" hidden></div></div>
<footer class="repl-footer">Одна запись — один учитель и один номер урока. Два класса не удваивают часы автоматически. Повторная публикация не дублирует записи. Проверить любую неделю можно в любой момент.</footer><datalist id="repl-teachers"></datalist></div>`;
document.body.append(dialog);
function ctx(){return api.getContext();}
function rpc(name,...args){return api.rpc(name,...args);}
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow'}).format(new Date());}
function addDays(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function period(date){const d=new Date(date+'T12:00:00Z');return[addDays(date,-((d.getUTCDay()+6)%7)),addDays(date,6-((d.getUTCDay()+6)%7))];}
function ru(date){return String(date).split('-').reverse().join('.');}
function dateLabel(date){const s=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',weekday:'long',day:'numeric',month:'long'}).format(new Date(date+'T12:00:00Z'));return s[0].toUpperCase()+s.slice(1);}
function recordCount(n){const tail=n%100,last=n%10;return n+' '+(tail>=11&&tail<=14?'записей':last===1?'запись':last>=2&&last<=4?'записи':'записей');}
function message(text,error=false){$('#repl-message').textContent=text;$('#repl-message').classList.toggle('error',error);}
function dirty(){return changed.size>0;}
function updateSave(){
  $('#repl-save-state').textContent=dirty()?`Несохранённых решений: ${changed.size}`:'';
  $('#repl-save').disabled=busy||!dirty();
}
function disabled(value){
  busy=value;dialog.querySelectorAll('button,input,select').forEach(el=>el.disabled=value);button.disabled=value;$('#replacement-week-open').disabled=value;updateSave();
}
function discard(){return !dirty()||confirm('Есть несохранённые решения за неделю. Отбросить их?');}
function teacherOptions(){
  const selected=$('#repl-teacher').value,names=ctx().teachers||[];
  $('#repl-teachers').innerHTML=names.map(t=>`<option value="${esc(t)}"></option>`).join('');
  $('#repl-teacher').innerHTML='<option value="">Все учителя</option>'+names.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  if(names.includes(selected))$('#repl-teacher').value=selected;
}
async function badge(){
  api=window.SchoolAdmin;if(!api||!ctx().ready)return;const run=++badgeRun;
  try{
    const data=await rpc('getReplacementWeeklyStatus',ctx().date||today());if(run!==badgeRun)return;
    $('#replacement-badge').textContent=data.pending||0;button.title=`Замены за неделю ${ru(data.selectedWeek.from)} — ${ru(data.selectedWeek.to)}. Ожидают решения: ${data.pending||0}`;
    reminderWeek=data.weeks?.[0]||null;reminder.hidden=!reminderWeek;
    if(reminderWeek){
      reminder.classList.remove('error');reminder.querySelector('strong').textContent='Проверьте замены за неделю';
      $('#replacement-week-text').textContent=`${ru(reminderWeek.from)} — ${ru(reminderWeek.to)} · ожидают решения: ${reminderWeek.pending}`+(data.weeks.length>1?` · непроверенных недель: ${data.weeks.length}`:'');
      $('#replacement-week-open').textContent='Открыть неделю';
    }
  }catch(e){
    if(run!==badgeRun)return;$('#replacement-badge').textContent='!';button.title='Не удалось проверить журнал замен: '+e.message;
  }
}
function filterRows(rows){
  const teacher=$('#repl-teacher').value,filter=$('#repl-filter').value;
  return(rows||[]).filter(r=>(!teacher||r.replacementTeacher===teacher)&&(filter==='all'||(filter==='active'?!['obsolete','legacy'].includes(r.decision):r.decision===filter)));
}
function entry(r){return `<article class="repl-entry" data-repl-id="${esc(r.id)}"><div><h3>${esc(r.replacementTeacher)}</h3><div class="repl-meta"><strong>${ru(r.date)} · ${r.lesson} урок · ${esc(r.className)}</strong><br>${esc(r.subject)}${r.room?' · '+esc(r.room):''}</div><details class="repl-basis" ${['combined','ambiguous','student-mismatch'].includes(r.kind)?'open':''}><summary>${esc(kinds[r.kind]||r.kind)} · основание</summary><p>${esc(r.reason)}</p>${r.originalChoices?.length?`<small>Исходные учителя: ${esc(r.originalChoices.join('; '))}</small>`:''}${r.source==='history-current-baseline'?'<small>История восстановлена по текущему основному расписанию — проверьте соответствие.</small>':''}</details></div>
<div class="repl-edit"><label>Решение<select data-field="decision">${['pending','confirm','exclude'].map(s=>`<option value="${s}" ${r.decision===s?'selected':''}>${status[s]}</option>`).join('')}</select></label><label>Часы<input data-field="hours" type="number" min="0.5" max="2" step="0.5" value="${r.hours||r.suggestedHours||1}"></label><label class="wide">Кого заменяет (несколько — через «;»)<input data-field="originalTeachers" list="repl-teachers" value="${esc(r.originalTeachers.join('; '))}" placeholder="Исходный учитель"></label><label class="wide">Пояснение решения<input data-field="comment" value="${esc(r.comment)}" placeholder="Для объединения и неоднозначных случаев"></label></div></article>`;}
function renderReview(){
  const rows=filterRows(review?.rows),groups=new Map();rows.forEach(r=>{if(!groups.has(r.date))groups.set(r.date,[]);groups.get(r.date).push(r);});
  $('#repl-review-list').innerHTML=rows.length?[...groups].map(([date,list])=>`<section class="repl-day-group" data-repl-day="${date}"><h3 class="repl-day-title">${esc(dateLabel(date))} <small>${recordCount(list.length)}</small></h3>${list.map(entry).join('')}</section>`).join(''):'<div class="empty">В выбранном периоде нет передач уроков другому учителю по этому фильтру. Простые отмены не требуют решения.</div>';
  updateSave();
}
function table(rows){return `<div class="repl-scroll"><table class="repl-table"><thead><tr><th>Дата</th><th>Урок / классы</th><th>Кто заменяет</th><th>Кого заменяет</th><th>Предмет</th><th>Решение</th><th>Часы в итоге</th><th>Пояснение</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="btn quiet small" data-review-date="${esc(r.date)}">${ru(r.date)}</button></td><td>${r.lesson} · ${esc(r.className)}</td><td>${esc(r.replacementTeacher)}</td><td>${esc(r.originalTeachers.join('; ')||'—')}</td><td>${esc(r.subject)}</td><td><span class="repl-tag ${esc(r.decision)}">${esc(status[r.decision]||r.decision)}</span></td><td>${r.countedHours||0}</td><td>${esc(r.comment||r.reason||'')}${r.decision==='confirm'&&!r.countedHours?'<br>Публикация не завершена — исключено из итога':''}</td></tr>`).join('')}</tbody></table></div>`;}
function confirmed(){const teacher=$('#repl-teacher').value;return(ledger?.rows||[]).filter(r=>r.countedHours>0&&(!teacher||r.replacementTeacher===teacher));}
function summaryRows(){const map=new Map();confirmed().forEach(r=>{if(!map.has(r.replacementTeacher))map.set(r.replacementTeacher,{teacher:r.replacementTeacher,hours:0,lessons:0});const n=map.get(r.replacementTeacher);n.hours+=r.countedHours;n.lessons++;});return [...map.values()].sort((a,b)=>a.teacher.localeCompare(b.teacher,'ru'));}
function summaryTable(){const rows=summaryRows();return `<table class="repl-table"><thead><tr><th>Учитель</th><th>Учтённые часы</th><th>Записи занятий</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.teacher)}</td><td>${r.hours}</td><td>${r.lessons}</td></tr>`).join('')}<tr><th>Итого</th><th>${rows.reduce((n,r)=>n+r.hours,0)}</th><th>${rows.reduce((n,r)=>n+r.lessons,0)}</th></tr></tbody></table>`;}
function renderLedger(){
  const rows=filterRows(ledger?.rows);$('#repl-journal-list').innerHTML=rows.length?table(rows):'<div class="empty">Записей по выбранным условиям нет.</div>';
  $('#repl-summary-list').innerHTML=`<div class="repl-kpi"><div><strong>${confirmed().reduce((n,r)=>n+r.countedHours,0)}</strong><span>подтверждённых часов</span></div><div><strong>${ledger?.pending||0}</strong><span>ожидают решения за период</span></div><div><strong>${ledger?.unreadyDates?.length||0}</strong><span>дней с незавершённым учётом</span></div></div>${summaryTable()}`;
}
async function loadAudit(){
  const date=$('#repl-date').value;if(!date)return;const rows=await rpc('getReplacementAudit',date);
  $('#repl-audit').innerHTML=rows.length?rows.map(r=>`<article class="repl-entry"><div><h3>${esc(r.after?.replacementTeacher||r.before?.replacementTeacher||'Запись')}</h3><p>${esc(r.at)} · ${esc(r.event)}</p><div>${esc(r.after?.className||r.before?.className||'')} · урок ${r.after?.lesson||r.before?.lesson||''}</div></div><div><p>${esc(status[r.before?.decision]||'Нет записи')} → <strong>${esc(status[r.after?.decision]||'Нет записи')}</strong></p><p>Часы: ${r.before?.hours||0} → ${r.after?.hours||0}</p><p>${esc(r.after?.comment||'')}</p></div></article>`).join(''):'<div class="empty">Изменений решений на эту дату нет.</div>';
}
function showTab(name){
  tab=name;dialog.querySelectorAll('[data-repl-tab]').forEach(b=>b.classList.toggle('active',b.dataset.replTab===name));
  dialog.querySelectorAll('.repl-view').forEach(el=>el.hidden=el.id!=='repl-'+name);$('#repl-audit-day').hidden=name!=='audit';
}
async function loadRange(from,to){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to))throw new Error('Укажите даты периода.');
  // Load everything before replacing state. On a failure unsaved decisions stay intact.
  const next=await rpc('getReplacementPeriodReview',from,to),nextLedger=await rpc('getReplacementLedger',from,to);
  review=next;ledger=nextLedger;changed.clear();$('#repl-from').value=from;$('#repl-to').value=to;
  $('#repl-week-label').textContent=`${ru(from)} — ${ru(to)}`;
  $('#repl-save').textContent='Сохранить решения за период';if(addDays(from,6)===to)$('#repl-save').textContent='Сохранить решения за неделю';
  if(!$('#repl-date').value||$('#repl-date').value<from||$('#repl-date').value>to)$('#repl-date').value=from;
  $('#repl-manual [name=date]').value=ctx().date>=from&&ctx().date<=to?ctx().date:from;
  renderReview();renderLedger();if(tab==='audit')await loadAudit();
  message(next.unreadyDates?.length?'Учёт не завершён за '+next.unreadyDates.map(ru).join(', ')+'. Эти дни исключены из часов.':
    `Период ${ru(from)} — ${ru(to)}. Передач уроков: ${next.rows.length}. Ожидают решения: ${next.rows.filter(r=>r.decision==='pending').length}.`,!!next.unreadyDates?.length);
}
async function run(action){if(busy)return;disabled(true);try{await action();}catch(e){message(e.message,true);}finally{disabled(false);}}
async function open(date){
  api=window.SchoolAdmin;if(!api||busy||!discard())return;
  if(dialog.hidden)previousFocus=document.activeElement;
  teacherOptions();dialog.hidden=false;$('#repl-close').focus();showTab('review');message('Загружаю всю неделю…');
  const [from,to]=period(date||ctx().date||today());await run(()=>loadRange(from,to));
}
function close(){if(busy||!discard())return;dialog.hidden=true;changed.clear();updateSave();previousFocus?.focus();}
async function changePeriod(from,to){
  if(busy)return;if(!discard()){if(review){$('#repl-from').value=review.from;$('#repl-to').value=review.to;}return;}
  await run(async()=>{try{await loadRange(from,to);}catch(e){if(review){$('#repl-from').value=review.from;$('#repl-to').value=review.to;}throw e;}});
}
button.onclick=()=>open(ctx().date);$('#repl-close').onclick=close;
$('#replacement-week-open').onclick=()=>open(reminderWeek?.from||ctx().date);
$('#repl-prev').onclick=()=>{const [from,to]=period(addDays(review?.from||ctx().date,-7));return changePeriod(from,to);};
$('#repl-next').onclick=()=>{const [from,to]=period(addDays(review?.from||ctx().date,7));return changePeriod(from,to);};
$('#repl-current').onclick=()=>changePeriod(...period(today()));
$('#repl-from').onchange=$('#repl-to').onchange=()=>changePeriod($('#repl-from').value,$('#repl-to').value);
$('#repl-refresh').onclick=()=>changePeriod($('#repl-from').value,$('#repl-to').value);
dialog.querySelectorAll('[data-repl-tab]').forEach(b=>b.onclick=()=>run(async()=>{showTab(b.dataset.replTab);if(tab==='audit')await loadAudit();}));
$('#repl-date').onchange=()=>run(loadAudit);
$('#repl-teacher').onchange=$('#repl-filter').onchange=()=>{renderReview();renderLedger();};
$('#repl-review-list').addEventListener('input',e=>{
  const field=e.target.dataset.field,id=e.target.closest('[data-repl-id]')?.dataset.replId;if(!field||!id||busy)return;
  const row=review?.rows.find(r=>r.id===id);if(!row)return;
  row[field]=field==='originalTeachers'?e.target.value.split(';').map(x=>x.trim()).filter(Boolean):field==='hours'?Number(e.target.value):e.target.value;
  if(field==='hours')row.hoursEdited=true;
  if(field==='decision'&&row.decision==='confirm'&&!row.hours&&!row.hoursEdited)row.hours=row.suggestedHours||1;changed.add(id);updateSave();
});
$('#repl-recommend').onclick=()=>{
  if(!review||busy)return;filterRows(review.rows).filter(r=>r.decision==='pending'&&r.suggestedDecision!=='pending').forEach(r=>{
    r.decision=r.suggestedDecision;r.hours=r.decision==='confirm'?(r.suggestedHours||1):0;changed.add(r.id);
  });renderReview();message('Рекомендации применены только к видимым строкам формы. Проверьте неделю и сохраните решения. Неоднозначные случаи оставлены на проверку.');
};
$('#repl-save').onclick=()=>run(async()=>{
  if(!review||!dirty())return;
  const days=review.days.map(day=>({date:day.date,revision:day.revision,reviewVersion:day.reviewVersion,
    decisions:review.rows.filter(r=>r.date===day.date&&changed.has(r.id)).map(r=>({id:r.id,decision:r.decision,hours:r.hours,originalTeachers:r.originalTeachers,comment:r.comment}))})).filter(d=>d.decisions.length);
  const from=review.from,to=review.to;await rpc('saveReplacementPeriodDecisions',from,to,days);
  // If readback fails do not permit a second save with now-stale versions.
  changed.clear();updateSave();await loadRange(from,to);message('Решения за период сохранены. В итог вошли только подтверждённые часы.');await badge();
});
$('#repl-journal-list').onclick=e=>{const b=e.target.closest('[data-review-date]');if(!b||busy)return;showTab('review');
  const group=[...dialog.querySelectorAll('[data-repl-day]')].find(el=>el.dataset.replDay===b.dataset.reviewDate);if(group)group.scrollIntoView({block:'start'});
};
$('#repl-restore').onclick=()=>{
  if(dirty()){message('Сначала сохраните решения или обновите период.',true);return;}
  if(!confirm('Восстановить пропущенные записи за период? Расписание не изменится. Только передачи уроков другому учителю будут предложены к проверке.'))return;
  return run(async()=>{const from=$('#repl-from').value,to=$('#repl-to').value,result=await rpc('restoreReplacementPeriod',from,to);
    await loadRange(from,to);message(`Восстановлено дней: ${result.restored.length}. Уже были: ${result.skipped.length}. Часы ожидают вашего решения.`);await badge();});
};
$('#repl-manual-toggle').onclick=()=>{$('#repl-manual').hidden=!$('#repl-manual').hidden;};
$('#repl-manual').onsubmit=e=>{
  e.preventDefault();if(dirty()){message('Сначала сохраните текущие решения.',true);return;}
  const form=e.target,values=Object.fromEntries(new FormData(form));return run(async()=>{
    if(!review||values.date<review.from||values.date>review.to)throw new Error('Дата ручной записи должна входить в выбранный период.');
    const day=await rpc('getReplacementReview',values.date);if(!day.exists)throw new Error('Сначала опубликуйте или восстановите этот день.');
    await rpc('addManualReplacement',values.date,day.revision,day.reviewVersion,values);await loadRange(review.from,review.to);form.hidden=true;
    message('Ручная передача урока добавлена. Подтвердите её в общем списке недели.');await badge();
  });
};
function csvCell(v){let s=String(v==null?'':v);if(/^[=+@-]/.test(s))s='\t'+s;return '"'+s.replace(/"/g,'""')+'"';}
$('#repl-csv').onclick=()=>{
  const rows=[['Дата','Урок','Классы','Предмет','Кто заменяет','Кого заменяет','Часы','Пояснение'],...confirmed().map(r=>[ru(r.date),r.lesson,r.className,r.subject,r.replacementTeacher,r.originalTeachers.join('; '),r.countedHours,r.comment])];
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Замены_'+review.from+'_'+review.to+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
function print(summary){$('#print-sheet').innerHTML=`<h1>${summary?'Сводка подтверждённых часов':'Подтверждённые замены'}</h1><p>${ru(review.from)} — ${ru(review.to)}</p>`+(summary?summaryTable():table(confirmed()).replace(/<button[^>]*>|<\/button>/g,''));window.print();}
$('#repl-print-summary').onclick=()=>print(true);$('#repl-print-detail').onclick=()=>print(false);
document.addEventListener('keydown',e=>{
  if(dialog.hidden)return;if(e.key==='Escape'){e.preventDefault();close();}
  if(e.key==='Tab'){
    const els=[...dialog.querySelectorAll('button,input,select,[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length);if(!els.length)return;
    const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
window.SchoolReplacementUI={open,isDirty:dirty,dayLoaded:()=>{api=window.SchoolAdmin;badge();},afterPublication:async(date,warning)=>{
  // Publication only records candidates. Never interrupt daily scheduling with a dialog.
  await badge();if(warning){reminder.hidden=false;reminder.classList.add('error');reminder.querySelector('strong').textContent='Проверьте состояние журнала замен';$('#replacement-week-text').textContent=warning;reminderWeek={from:date};}
}};
api=window.SchoolAdmin;if(api&&ctx().ready)badge();
setInterval(()=>{if(!document.hidden&&!busy)badge();},300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)badge();});
})();
</script>
