name: MAX Worker syntax check

on:
  push:
    paths:
      - 'max-worker/**'
      - '.github/workflows/max-worker-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check max-worker/src/index.js
