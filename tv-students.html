<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Экран для учеников — СОШ №20</title><link rel="icon" href="assets/school-logo.jpg"><style>

r:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(34,61,109,.06)}.class-card>header{padding:9px 11px 7px;border-bottom:1px solid #edf1f6;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,#f9fbff,#f2faf5)}.class-card h2{margin:0;font-size:clamp(22px,1.7vw,32px);color:var(--navy)}.summary{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.summary span{padding:3px 6px;border-radius:999px;border:1px solid #dfe6f1;background:#fff;color:#53627e;font-size:clamp(8px,.58vw,11px);font-weight:900}.summary .red{background:#fff0f1;color:#b72d3b;border-color:#f1cbd0}.summary .blue{background:#eef3ff;color:#3154df;border-color:#d4dfff}.summary .amber{background:#fff7df;color:#966300;border-color:#f0dfad}.summary .green{background:#ebf8f2;color:#1c7a55;border-color:#cfeadd}.lessons{display:flex;flex-direction:column;min-height:0;flex:1}.lesson{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:0;flex:1;padding:4px 8px;border-bottom:1px solid #edf1f6;background:#fff}.lesson:last-child{border-bottom:0}.lesson-no{text-align:center;color:#547099}.lesson-no b{display:block;font-size:clamp(16px,1.15vw,22px);color:#173d77}.lesson-no span{display:block;font-size:clamp(7px,.5vw,10px);white-space:nowrap;margin-top:1px}.lesson-main{min-width:0;display:grid;gap:1px;align-content:center}.lesson-main strong{font-size:clamp(13px,.9vw,17px);line-height:1.08;color:#142d59;overflow-wrap:anywhere}.lesson-main small,.lesson-main del{font-size:clamp(8px,.58vw,11px);line-height:1.05;color:#71809a;overflow-wrap:anywhere}.lesson-main del{color:#95636b;text-decoration-thickness:1.6px}.lesson em{font-style:normal;border-radius:999px;padding:4px 6px;font-size:clamp(7px,.5vw,9px);font-weight:950;white-space:nowrap}.lesson.cancelled{background:#fff0f1;border-left:4px solid var(--red)}.lesson.cancelled em{background:#ffdce0;color:#aa2130}.lesson.changed{background:#eef3ff;border-left:4px solid #4b6df0}.lesson.changed em{background:#dfe8ff;color:#3154df}.lesson.room{background:#fff8e5;border-left:4px solid #d8a02a}.lesson.room em{background:#f7e7b7;color:#8a5b00}.lesson.added{background:#edf9f3;border-left:4px solid #3b9b73}.lesson.added em{background:#d9f1e5;color:#1d7956}.lesson.is-current{box-shadow:inset 0 0 0 2px #3154df;z-index:1}.lesson.is-current:after{content:'СЕЙЧАС';position:absolute;top:3px;right:5px;color:#3154df;font-size:7px;font-weight:950}.no-lessons,.error-card{display:grid;place-content:center;text-align:center;color:var(--muted);padding:20px}.foot{color:var(--muted);display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;font-size:12px;font-weight:750}.foot span:nth-child(2){text-align:center;color:#36558d;font-weight:900}.foot span:last-child{text-align:right}.progress{height:5px;background:#dce5f3;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3154df,#6ca77c);transition:width .35s ease}@keyframes pageIn{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:1100px){.classes{gap:7px}.class-card>header{padding:7px 8px}.lesson{grid-template-columns:40px minmax(0,1fr) auto;gap:5px;padding:3px 5px}.clock{min-width:200px}.logo{width:52px;height:52px}}@media(max-width:700px){body{overflow:auto}.tv{height:auto;min-height:100vh}.classes{grid-template-columns:1fr!important}.foot{grid-template-columns:1fr}.foot span,.foot span:last-child{text-align:left!important}}
</style></head><body><main class="tv"><div class="head"><div class="head-left"><img class="logo" src="assets/school-logo.jpg" alt=""><div><span class="school">МОУ «СОШ № 20» имени И. А. Рыбалко · экран для учеников</span><div class="title-line"><h1 id="parallel">Параллель</h1><span class="parallel-sub" id="parallel-sub"></span></div><span class="date" id="date"></span></div></div><div class="clock"><strong id="time">--:--</strong><span id="countdown">Загрузка…</span></div></div><div id="notice"></div><div class="classes" id="classes"></div><div class="foot"><span>Показывается полное актуальное расписание</span><span id="page"></span><span>Данные обновлены: <span id="updated">—</span></span></div><div class="progress"><i id="progress"></i></div></main><script src="config.js?v=tv-students-1"></script><script src="content.js?v=features-16"></script><script src="app.js?v=features-16"></script><script src="subject-names.js?v=1"></script><script src="tv-students.js?v=subjects-1"></script></body></html>
