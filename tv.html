om{color:#566b89;font-weight:900;white-space:nowrap}.badge{font-style:normal;border-radius:999px;padding:4px 6px;font-size:clamp(7px,.48vw,9px);font-weight:950;white-space:nowrap}.lesson.cancelled{background:#fff0f1;border-left:4px solid var(--red)}.lesson.cancelled .badge{background:#ffdce0;color:#aa2130}.lesson.changed{background:#eef3ff;border-left:4px solid #4b6df0}.lesson.changed .badge{background:#dfe8ff;color:#3154df}.lesson.room-change{background:#fff8e5;border-left:4px solid #d8a02a}.lesson.room-change .badge{background:#f7e7b7;color:#8a5b00}.lesson.added{background:#edf9f3;border-left:4px solid #3b9b73}.lesson.added .badge{background:#d9f1e5;color:#1d7956}.lesson.is-current{z-index:2;box-shadow:inset 0 0 0 3px #3154df,0 0 22px rgba(49,84,223,.34);animation:lessonGlow 2.4s ease-in-out infinite}.lesson.is-current:after{content:'СЕЙЧАС';position:absolute;top:4px;right:5px;padding:2px 5px;border-radius:999px;background:#3154df;color:#fff;font-size:7px;font-weight:950}.lesson.break-after{z-index:2;box-shadow:0 12px 24px -14px rgba(48,154,111,.95)}.lesson.break-after:before{content:'ПЕРЕМЕНА';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:6;padding:3px 9px;border-radius:999px;background:#effaf4;color:#217553;border:1px solid #94d3b7;box-shadow:0 0 18px rgba(47,154,111,.38);font-size:clamp(7px,.48vw,9px);font-weight:950;letter-spacing:.05em;white-space:nowrap}.empty-card{display:grid;min-height:100%;place-content:center;text-align:center;padding:20px;color:var(--muted);font-size:clamp(14px,1vw,18px)}.foot{color:var(--muted);display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;font-size:12px;font-weight:750}.foot span:nth-child(2){text-align:center;color:#36558d;font-weight:900}.foot span:last-child{text-align:right}.progress{height:5px;background:#dce5f3;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3154df,#6ca77c);transition:width .35s ease}@keyframes pageIn{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes lessonGlow{0%,100%{box-shadow:inset 0 0 0 3px #3154df,0 0 14px rgba(49,84,223,.22)}50%{box-shadow:inset 0 0 0 3px #3154df,0 0 30px rgba(49,84,223,.48)}}@media(max-width:1050px){.teachers{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.clock{min-width:200px}.logo{width:52px;height:52px}}@media(max-width:700px){body{overflow:auto}.tv{height:auto;min-height:100vh}.teachers{grid-template-columns:1fr!important;grid-template-rows:auto!important}.foot{grid-template-columns:1fr}.foot span,.foot span:last-child{text-align:left!important}}
</style></head><body><main class="tv"><div class="head"><div class="head-left"><img class="logo" src="assets/school-logo.jpg" alt=""><div><span class="school">МОУ СОШ № 20 · экран учительской</span><div class="title-line"><h1>Расписание учителей</h1><span class="head-sub">Полное расписание на сегодня с учётом всех изменений</span></div><span class="date" id="date"></span></div></div><div class="clock"><strong id="time">--:--</strong><span id="countdown">Загрузка…</span></div></div><div id="notice"></div><div class="teachers" id="teachers"></div><div class="foot"><span>Показывается полное актуальное расписание</span><span id="page"></span><span>Данные обновлены: <span id="updated">—</span></span></div><div class="progress"><i id="progress"></i></div></main><script src="config.js?v=tv-teachers-3"></script><script src="content.js?v=features-16"></script><script src="app.js?v=features-16"></script><script src="subject-names.js?v=1"></script><script src="tv.js?v=tv-teachers-3"></script></body></html>
