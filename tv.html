<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Экран учительской — СОШ №20</title><link rel="icon" href="assets/school-logo.jpg"><style>
:root{--bg:#071633;--card:#102552;--text:#fff;--muted:#aebee2;--accent:#6f91ff;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh;overflow:hidden}.tv{padding:2.2vh 2.4vw;height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:1.5vh}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{font-size:clamp(28px,3vw,54px);margin:0}.clock{text-align:right}.clock strong{font-size:clamp(30px,4vw,64px)}.clock span{display:block;color:var(--muted);font-size:clamp(13px,1.3vw,20px)}.state{background:#142d61;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;font-size:clamp(15px,1.5vw,24px)}.changes{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;align-content:start;overflow:hidden}.teacher{background:var(--card);border:1px solid #29457d;border-radius:18px;padding:14px}.teacher h2{margin:0 0 8px;font-size:clamp(18px,1.6vw,28px)}.row{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.1)}.row b{color:#bcd0ff}.cancel{color:#ffb0b0}.foot{color:var(--muted);display:flex;justify-content:space-between;font-size:14px}.notice{background:#fff3c9;color:#382b00;border-radius:14px;padding:10px 14px;font-weight:750}@media(max-width:1000px){.changes{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="tv"><div class="head"><div><h1>Изменения для учителей</h1><span id="date"></span></div><div class="clock"><strong id="time">--:--</strong><span id="countdown">Загрузка…</span></div></div><div id="notice"></div><div class="changes" id="changes"></div><div class="foot"><span>МОУ СОШ №20 г. Твери</span><span>Автообновление каждую минуту · <span id="updated">—</span></span></div></main><script src="config.js?v=mgmt-3"></script><script src="content.js?v=mgmt-3"></script><script src="app.js?v=mgmt-3"></script><script src="tv.js?v=mgmt-3"></script></body></html>
