<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Экран учительской — СОШ №20</title>
  <link rel="icon" href="assets/icons/favicon-48.png" type="image/png">
  <link rel="stylesheet" href="tv.css?v=18">
</head>
<body>
  <main class="tv">
    <div class="head">
      <div class="head-left">
        <img class="logo" src="assets/icons/logo-128.jpg" alt="">
        <div>
          <div class="title-line"><h1>Расписание учителей</h1></div>
          <span class="date"><span class="school-inline">МОУ СОШ № 20 · </span><span id="date"></span></span>
        </div>
      </div>
      <div class="clock">
        <div class="moment"><small id="countdown-label">Загрузка…</small><b id="countdown"></b></div>
        <strong id="time">--:--</strong>
      </div>
    </div>
    <div id="notice"></div>
    <div class="teachers" id="teachers"></div>
    <div class="foot">
      <span>Показываются только текущие и предстоящие уроки</span>
      <div class="pager"><div class="segments" id="segments" aria-hidden="true"></div><b id="page"></b></div>
      <span>Данные обновлены: <span id="updated">—</span></span>
    </div>
    <div class="progress"><i id="progress"></i></div>
  </main>
  <script src="config.js?v=18"></script>
  <script src="app.js?v=18"></script>
  <script src="subject-names.js?v=18"></script>
  <script src="tv.js?v=18"></script>
</body>
</html>
