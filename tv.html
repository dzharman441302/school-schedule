<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Экран учительской — СОШ №20</title><link rel="icon" href="assets/school-logo.jpg"><style>
:root{--bg:#071633;--card:#102552;--text:#fff;--muted:#aebee2;--accent:#6f91ff;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh;overflow:hidden}.tv{padding:2vh 2.2vw;height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:1.25vh}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{font-size:clamp(28px,3vw,54px);margin:0}.head>div:first-child>span{color:var(--muted);font-size:clamp(14px,1.2vw,20px)}.clock{text-align:right}.clock strong{font-size:clamp(30px,4vw,64px)}.clock span{display:block;color:#d8e3ff;font-size:clamp(14px,1.35vw,21px);font-weight:750}.changes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1vw;align-content:stretch;min-height:0;overflow:hidden}.changes.page-enter{animation:pageIn .35s ease}.teacher{min-height:0;overflow:hidden;background:var(--card);border:1px solid #29457d;border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.teacher h2{margin:0 0 7px;font-size:clamp(17px,1.45vw,25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:grid;grid-template-columns:38px minmax(0,1fr);gap:7px;padding:5px 0;border-top:1px solid rgba(255,255,255,.1);font-size:clamp(12px,1vw,17px);line-height:1.2}.row b{color:#bcd0ff}.cancel{color:#ffb0b0}.cancel del{text-decoration-thickness:2px}.teacher--empty{grid-column:1/-1;display:grid;place-content:center;text-align:center}.foot{color:var(--muted);display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;font-size:14px}.foot span:nth-child(2){text-align:center;color:#d5e0ff;font-weight:800}.foot span:last-child{text-align:right}.notice{background:#fff3c9;color:#382b00;border-radius:14px;padding:9px 14px;display:flex;gap:8px;align-items:baseline;font-weight:750}.notice strong{font-size:1.04em}.notice span{font-weight:650}@keyframes pageIn{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:1000px){.changes{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.foot{font-size:12px}}
