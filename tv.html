<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Экран учительской — СОШ №20</title><link rel="icon" href="assets/school-logo.jpg"><style>
:root{--bg:#eef4ff;--panel:#fff;--navy:#16366c;--blue:#3154df;--text:#18305a;--muted:#71809c;--red:#b93f47;--line:#dfe6f1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf4ff,#f5faf6);color:var(--text);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh;overflow:hidden}.tv{height:100vh;padding:1.8vh 1.8vw;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:1.15vh}.head{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 18px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 12px 30px rgba(34,61,109,.08)}.head-left{display:flex;align-items:center;gap:14px;min-width:0}.logo{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #e0e6f0}.head h1{font-size:clamp(26px,2.5vw,46px);margin:0;color:var(--navy)}.head .school{display:block;color:var(--muted);font-size:clamp(11px,.9vw,15px);font-weight:750;margin-bottom:3px}.head .date{display:block;color:#557098;font-size:clamp(13px,1vw,17px);font-weight:750;margin-top:2px}.clock{text-align:right;min-width:240px}.clock strong{display:block;font-size:clamp(38px,4.2vw,70px);line-height:.92;color:var(--navy)}.clock span{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:999px;background:#edf3ff;color:#244d92;font-size:clamp(13px,1.2vw,19px);font-weight:900}.notice{background:linear-gradient(90deg,#fff3bd,#eef7cc);color:#4b4b17;border:1px solid #e9df96;border-radius:14px;padding:9px 13px;display:flex;gap:9px;align-items:baseline;font-weight:800}.notice strong{font-size:1.05em}.notice span{font-weight:650}.changes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1vw;align-content:stretch;min-height:0;overflow:hidden}.changes.page-enter{animation:pageIn .35s ease}.teacher{min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 9px 24px rgba(34,61,109,.07)}.teacher h2{margin:0 0 7px;font-size:clamp(18px,1.5vw,27px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy)}.teacher h2 small{font-size:.55em;color:var(--muted);font-weight:700}.row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid #edf1f6;font-size:clamp(13px,1.05vw,18px);line-height:1.22}.row b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#edf3ff;color:#3154df}.cancel{color:var(--red)}.cancel del{text-decoration-thickness:2px}.teacher--empty{grid-column:1/-1;display:grid;place-content:center;text-align:center}.foot{color:var(--muted);display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;font-size:13px;font-weight:700}.foot span:nth-child(2){text-align:center;color:#36558d;font-weight:900}.foot span:last-child{text-align:right}.progress{height:5px;background:#dce5f3;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3154df,#6ca77c);transition:width .35s ease}@keyframes pageIn{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:1000px){.changes{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.clock{min-width:180px}.logo{width:56px;height:56px}.foot{font-size:11px}}
</style></head><body><main class="tv"><div class="head"><div class="head-left"><img class="logo" src="assets/school-logo.jpg" alt=""><div><span class="school">МОУ «СОШ № 20» имени И. А. Рыбалко</span><h1>Изменения для учителей</h1><span class="date" id="date"></span></div></div><div class="clock"><strong id="time">--:--</strong><span id="countdown">Загрузка…</span></div></div><div id="notice"></div><div class="changes" id="changes"></div><div class="foot"><span>Экран обновляется автоматически</span><span id="page"></span><span>Данные обновлены: <span id="updated">—</span></span></div><div class="progress"><i id="progress"></i></div></main><script src="config.js?v=ui-20260914b"></script><script src="content.js?v=features-16"></script><script src="app.js?v=features-16"></script><script src="tv.js?v=ui-20260914b"></script></body></html>
