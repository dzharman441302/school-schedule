<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Экран учительской — СОШ №20</title><link rel="icon" href="assets/school-logo.jpg"><style>
:root{--navy:#102d5b;--blue:#3154df;--panel:#fff;--text:#152a50;--muted:#71809c;--line:#dbe3ef;--red:#d94452;--green:#22895f;--amber:#b77a00}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:linear-gradient(145deg,#edf4ff,#f7fbf8);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;color:var(--text)}.tv{height:100vh;padding:1.2vh 1.15vw;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:.75vh}.head{background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 10px 28px rgba(28,55,98,.07)}.head-left{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid #e0e6f0}.school{display:block;color:#617391;font-size:clamp(10px,.7vw,13px);font-weight:850}.title-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.head h1{margin:0;color:var(--navy);font-size:clamp(22px,1.75vw,34px)}.sub{font-size:clamp(10px,.72vw,13px);color:#637491;font-weight:750}.date{display:block;color:#557098;font-size:clamp(10px,.72vw,14px);font-weight:750;margin-top:1px}.clock{text-align:right;min-width:230px}.clock strong{display:block;color:var(--navy);font-size:clamp(36px,3.3vw,58px);line-height:.9}.clock span{display:inline-block;margin-top:5px;padding:6px 11px;border-radius:999px;background:#edf3ff;color:#244d92;font-size:clamp(11px,.9vw,16px);font-weight:900}.notice{background:linear-gradient(90deg,#fff3bd,#eef7cc);color:#4b4b17;border:1px solid #e9df96;border-radius:13px;padding:6px 11px;display:flex;gap:8px;align-items:baseline;font-weight:800}.notice span{font-weight:650}.teachers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:.7vw;min-height:0;overflow:hidden}.teachers.page-enter{animation:pageIn .28s ease}.teacher-card{min-width:0;min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:17px;display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(34,61,109,.055)}.teacher-card>header{padding:7px 9px 6px;border-bottom:1px solid #edf1f6;display:flex;justify-content:space-between;align-items:center;gap:7px;background:linear-gradient(90deg,#f9fbff,#f2faf5)}.teacher-card h2{margin:0;font-size:clamp(15px,1.05vw,21px);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}.summary span{padding:2px 5px;border-radius:999px;border:1px solid #dfe6f1;background:#fff;color:#53627e;font-size:clamp(7px,.48vw,9px);font-weight:900;white-space:nowrap}.summary .red{background:#fff0f1;color:#b72d3b;border-color:#f1cbd0}.summary .blue{background:#eef3ff;color:#3154df;border-color:#d4dfff}.summary .amber{background:#fff7df;color:#966300;border-color:#f0dfad}.summary .green{background:#ebf8f2;color:#1c7a55;border-color:#cfeadd}.teacher-lessons{display:flex;flex-direction:column;min-height:0;flex:1}.lesson{position:relative;display:grid;grid-template-columns:28px 42px 33px minmax(0,1fr) auto;gap:4px;align-items:center;min-height:0;flex:1;padding:2px 6px;border-bottom:1px solid #edf1f6;background:#fff;line-height:1.04}.lesson:last-child{border-bottom:0}.lesson .num{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#f0f4fb;color:#173d77;font-size:clamp(10px,.7vw,13px);font-weight:950}.lesson .time{font-size:clamp(7px,.46vw,9px);color:#657692;white-space:nowrap}.lesson .cls{font-size:clamp(9px,.58vw,11px);font-weight:900;color:#28436d;white-space:nowrap}.lesson-main{min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden}.lesson-main strong{font-size:clamp(9px,.63vw,12px);color:#142d59;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lesson-main small,.lesson-main del{font-size:clamp(7px,.48vw,9px);color:#71809a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lesson-main del{color:#95636b;text-decoration-thickness:1.5px}.room{font-size:clamp(8px,.52vw,10px);font-weight:850;color:#51617f;white-space:nowrap}.badge{font-style:normal;border-radius:999px;padding:3px 5px;font-size:clamp(6px,.43vw,8px);font-weight:950;white-space:nowrap}.lesson.cancelled{background:#fff0f1;border-left:3px solid var(--red)}.lesson.cancelled .badge{background:#ffdce0;color:#aa2130}.lesson.changed{background:#eef3ff;border-left:3px solid #4b6df0}.lesson.changed .badge{background:#dfe8ff;color:#3154df}.lesson.room-change{background:#fff8e5;border-left:3px solid #d8a02a}.lesson.room-change .badge{background:#f7e7b7;color:#8a5b00}.lesson.added{background:#edf9f3;border-left:3px solid #3b9b73}.lesson.added .badge{background:#d9f1e5;color:#1d7956}.lesson.is-current{z-index:2;box-shadow:inset 0 0 0 2px #3984f4,0 0 16px rgba(57,132,244,.22);animation:currentGlow 2.4s ease-in-out infinite}.lesson.is-current:after{content:'СЕЙЧАС';position:absolute;right:4px;top:2px;color:#1f66d3;font-size:6px;font-weight:950}.lesson.break-after{z-index:3;box-shadow:0 9px 19px -13px rgba(37,161,112,.95)}.lesson.break-after:before{content:'ПЕРЕМЕНА';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);z-index:8;padding:2px 7px;border-radius:999px;background:#effbf5;color:#147554;border:1px solid #93d6ba;box-shadow:0 0 14px rgba(53,168,122,.32);font-size:6px;font-weight:950;letter-spacing:.05em;white-space:nowrap}.free-row{color:#a0aabc}.free-row .num{background:#f7f8fb;color:#a0aabc}.free-row .cls,.free-row .room{color:#a0aabc}.empty-card{grid-column:1/-1;display:grid;place-content:center;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;color:var(--muted)}.foot{color:var(--muted);display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;font-size:11px;font-weight:750}.foot span:nth-child(2){text-align:center;color:#36558d;font-weight:900}.foot span:last-child{text-align:right}.progress{height:5px;background:#dce5f3;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3154df,#6ca77c);transition:width .35s ease}@keyframes currentGlow{0%,100%{box-shadow:inset 0 0 0 2px #3984f4,0 0 12px rgba(57,132,244,.16)}50%{box-shadow:inset 0 0 0 2px #3984f4,0 0 22px rgba(57,132,244,.36)}}@keyframes pageIn{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:1100px){.teachers{gap:6px}.lesson{grid-template-columns:26px 38px 30px minmax(0,1fr) auto;padding:2px 4px}.logo{width:50px;height:50px}.clock{min-width:190px}}@media(max-width:700px){body{overflow:auto}.tv{height:auto;min-height:100vh}.teachers{grid-template-columns:1fr!important;grid-template-rows:none}.foot{grid-template-columns:1fr}.foot span,.foot span:last-child{text-align:left!important}}
</style></head><body><main class="tv"><div class="head"><div class="head-left"><img class="logo" src="assets/school-logo.jpg" alt=""><div><span class="school">МОУ СОШ № 20</span><div class="title-line"><h1>Экран для учителей</h1><span class="sub">Полное расписание на сегодня с учётом изменений</span></div><span class="date" id="date"></span></div></div><div class="clock"><strong id="time">--:--</strong><span id="countdown">Загрузка…</span></div></div><div id="notice"></div><div class="teachers" id="teachers"></div><div class="foot"><span>Показывается полное актуальное расписание</span><span id="page"></span><span>Данные обновлены: <span id="updated">—</span></span></div><div class="progress"><i id="progress"></i></div></main><script src="config.js?v=teacher-full-1"></script><script src="content.js?v=features-16"></script><script src="app.js?v=features-16"></script><script src="subject-names.js?v=1"></script><script src="tv.js?v=teacher-full-1"></script></body></html>
